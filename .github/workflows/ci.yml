name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # tsc -b (uygulama, vite/playwright yapılandırması ve e2e testleri) + vite build
      - run: npm run build
      - run: npm test
      # Uçtan uca testler gerçek backend ve boş SQL Server veritabanı gerektirir; yerelde çalıştırılır (e2e/README.md)
